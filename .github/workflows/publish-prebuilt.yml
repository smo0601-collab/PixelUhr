name: Publish prebuilt releases

# One-off helper: publishes the releases v1.0.0 to v1.0.3 from the files in the
# temporary branch "release-files" (tag, title, notes, binaries), then deletes
# that branch. Releases that already exist are skipped.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Get release files
        uses: actions/checkout@v4
        with:
          ref: release-files

      - name: Create releases
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          latest="$(tail -n 1 versions.txt | cut -d' ' -f1)"
          while read -r tag sha; do
            [ -n "$tag" ] || continue
            if gh release view "$tag" --repo "$REPO" >/dev/null 2>&1; then
              echo "$tag exists, skipped"
              continue
            fi
            flag="--latest=false"
            [ "$tag" = "$latest" ] && flag="--latest"
            gh release create "$tag" --repo "$REPO" --target "$sha" \
              --title "PixelUhr ${tag#v}" --notes-file "$tag/NOTES.md" "$flag" \
              "$tag"/*.bin "$tag/SHA256SUMS.txt"
            echo "$tag published"
          done < versions.txt

      - name: Delete helper branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X DELETE "repos/${{ github.repository }}/git/refs/heads/release-files"
